name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors on the commit
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed. Errors:"
            echo '```'
            grep -E "^e: |error:|What went wrong|FAILED|Exception" build.log | head -60 || true
            echo '```'
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OrbitEQ.apk

      - name: Upload APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: OrbitEQ-apk
          path: OrbitEQ.apk

      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Orbit EQ build ${{ github.run_number }}
          files: OrbitEQ.apk

      - name: YouTube smoke test (real network)
        id: ytsmoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon 2>&1 | tee yt.log

      - name: Report YouTube smoke test on the commit
        if: always() && steps.ytsmoke.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "YouTube smoke test: ${{ steps.ytsmoke.outcome }}"
            echo '```'
            grep -E "YT_SMOKE|PASSED|FAILED|SKIPPED|Exception|Caused by|at com\.ck|^e: " yt.log | grep -v "progress" | head -60 || true
            echo '```'
          } > yt.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@yt.md

  # Launches the APK on an Android emulator, taps through the main screens,
  # saves screenshots and reports any crash. Never blocks the APK release.
  uitest:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OrbitEQ-apk

      - name: Make test songs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          bash .github/scripts/make-test-music.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/ui-test.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test
          path: |
            shots/
            logcat.txt
            crashes.txt
            media_session.txt

      - name: Report crashes on the commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "UI test: $(ls shots 2>/dev/null | wc -l) screenshots"
            echo '```'
            head -80 crashes.txt 2>/dev/null || echo "no crash file"
            echo '```'
          } > ui.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@ui.md
